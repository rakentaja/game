<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>INKWAKE · dev · THE EDITOR</title>
  <style>
    html, body { margin: 0; height: 100%; background: #120d0c; overflow: hidden; overscroll-behavior: none;
      font: 600 13px/1.2 'Bangers', Impact, 'Arial Narrow Bold', sans-serif; color: #efe1c9; user-select: none; -webkit-user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    .hud { position: fixed; pointer-events: none; }
    #pages { top: calc(env(safe-area-inset-top, 0px) + 14px); left: 14px; display: flex; gap: 5px; }
    #pages i { width: 18px; height: 24px; background: #efe1c9; border: 2px solid #16100e; transform: rotate(-4deg);
      box-shadow: 2px 2px 0 #16100e; clip-path: polygon(0 0, 100% 0, 100% 82%, 80% 100%, 62% 86%, 40% 100%, 20% 88%, 0 100%); }
    #pages i:nth-child(2n) { transform: rotate(3deg); }
    #pages i.torn { background: #6e2f2c; opacity: .35; }
    #energy { top: calc(env(safe-area-inset-top, 0px) + 46px); left: 14px; width: 120px; height: 10px; border: 2px solid #16100e;
      background: #2a2224; box-shadow: 2px 2px 0 #16100e; transform: skewX(-12deg); }
    #energy-fill { height: 100%; background: #f6c35a; transform-origin: left; }
    #boss { top: calc(env(safe-area-inset-top, 0px) + 14px); left: 50%; transform: translateX(-50%) translateY(-120%);
      width: min(62vw, 420px); transition: transform .5s cubic-bezier(.2,1.6,.4,1); text-align: center; }
    #boss.on { transform: translateX(-50%) translateY(0); }
    #boss-name { font-size: 22px; letter-spacing: .12em; color: #efe1c9; text-shadow: 2px 2px 0 #16100e, -1px -1px 0 #16100e, 1px -1px 0 #16100e, -1px 1px 0 #16100e; }
    #boss-bar { height: 12px; margin-top: 3px; border: 3px solid #16100e; background: #efe1c9; box-shadow: 3px 3px 0 #16100e; position: relative; }
    #boss-fill { height: 100%; background: repeating-linear-gradient(62deg, #6e2f2c 0 4px, #b8655c 4px 7px); transform-origin: left; transition: transform .25s; }
    #boss-bar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 33.1%, #16100e 33.1% 34%, transparent 34% 66.4%, #16100e 66.4% 67.3%, transparent 67.3%); }
    #boss-phase { margin-top: 4px; font-size: 13px; letter-spacing: .2em; color: #f6c35a; text-shadow: 2px 2px 0 #16100e; }
    #hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); left: 50%; transform: translateX(-50%) rotate(-1deg); width: min(86vw, 560px);
      background: #efe1c9; color: #16100e; border: 3px solid #16100e; box-shadow: 4px 4px 0 #16100e; padding: 8px 12px; font-size: 14px;
      letter-spacing: .04em; text-align: center; }
    #hint:empty { display: none; }
    #hint.pop { animation: pop .35s cubic-bezier(.2,1.8,.4,1); }
    @keyframes pop { from { transform: translateX(-50%) rotate(-1deg) scale(.6); } }
    #panel { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
    #panel.on { opacity: 1; }
    #panel .gutter { position: absolute; background: #efe1c9; box-shadow: 0 0 0 4px #16100e; }
    #panel .g1 { left: -10%; right: -10%; top: 30%; height: 10px; transform: rotate(-6deg) scaleX(0); transform-origin: left; }
    #panel .g2 { top: -10%; bottom: 55%; left: 58%; width: 10px; transform: rotate(9deg) scaleY(0); transform-origin: top; }
    #panel.on .g1 { animation: gx .18s ease-out forwards; }
    #panel.on .g2 { animation: gy .18s .08s ease-out forwards; }
    @keyframes gx { to { transform: rotate(-6deg) scaleX(1); } }
    @keyframes gy { to { transform: rotate(9deg) scaleY(1); } }
    #panel .frame { position: absolute; inset: 0; box-shadow: inset 0 0 0 10px #16100e, inset 0 0 0 16px #efe1c9, inset 0 0 0 20px #16100e; }
    #panel-burst { position: absolute; left: 50%; top: 22%; width: 120vmin; height: 60vmin; transform: translate(-50%, -50%) scale(0);
      background: radial-gradient(circle, #f6c35a 0 1.3px, transparent 1.6px) 0 0 / 7px 7px;
      clip-path: polygon(50% 0, 58% 32%, 85% 8%, 68% 40%, 100% 38%, 70% 55%, 96% 80%, 62% 66%, 54% 100%, 46% 68%, 14% 92%, 32% 58%, 0 52%, 30% 42%, 10% 12%, 42% 32%); }
    #panel.on #panel-burst { animation: burst .3s cubic-bezier(.2,1.6,.4,1) forwards; }
    @keyframes burst { to { transform: translate(-50%, -50%) scale(1); } }
    #panel-word { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%) rotate(-8deg) scale(0); font-size: min(20vw, 140px);
      letter-spacing: .02em; color: #f6c35a; -webkit-text-stroke: 4px #16100e; paint-order: stroke fill;
      text-shadow: 6px 6px 0 #16100e, 10px 10px 0 #e2794e; white-space: nowrap; }
    #panel.on #panel-word { animation: word .35s .05s cubic-bezier(.2,2,.4,1) forwards; }
    @keyframes word { to { transform: translate(-50%, -50%) rotate(-8deg) scale(1); } }
    #fin { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; pointer-events: none;
      opacity: 0; transition: opacity 1.2s; color: #efe1c9; letter-spacing: .3em; font-size: 20px; }
    #fin b { font-size: min(16vw, 96px); letter-spacing: .08em; color: #efe1c9; -webkit-text-stroke: 2px #e2794e; }
    #fin.on { opacity: 1; }
    #dbg { position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); display: flex; flex-wrap: wrap; gap: 4px;
      justify-content: flex-end; width: 200px; }
    #dbg button { font: inherit; font-size: 12px; letter-spacing: .08em; background: #efe1c9; color: #16100e; border: 2px solid #16100e;
      box-shadow: 2px 2px 0 #16100e; padding: 4px 7px; cursor: pointer; }
    #dbg button.on { background: #f6c35a; }
    #dbg-info { position: fixed; left: 10px; bottom: 4px; font: 10px ui-monospace, Menlo, monospace; color: #7d6359; }
    #keys { position: fixed; right: 10px; top: calc(env(safe-area-inset-top, 0px) + 12px); font: 10px/1.5 ui-monospace, Menlo, monospace; color: #a77f70; text-align: right; }
    body.shot #dbg, body.shot #dbg-info, body.shot #keys { display: none; }
    @media (max-width: 600px) { #keys { display: none; } #dbg { width: 150px; } }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud" id="pages"></div>
  <div class="hud" id="energy"><div id="energy-fill"></div></div>
  <div class="hud" id="boss"><div id="boss-name">THE EDITOR</div><div id="boss-bar"><div id="boss-fill"></div></div><div id="boss-phase"></div></div>
  <div class="hud" id="hint"></div>
  <div id="panel"><div class="frame"></div><div class="gutter g1"></div><div class="gutter g2"></div><div id="panel-burst"></div><div id="panel-word"></div></div>
  <div id="fin"><b>FIN.</b><span>THE PAGE IS INKED</span></div>
  <div id="dbg">
    <button id="b-start">START</button><button id="b-p1">P1</button><button id="b-p2">P2</button><button id="b-p3">P3</button>
    <button id="b-kill">KILL</button><button id="b-reset">RESET</button><button id="b-diff">NORMAL</button><button id="b-god">GOD</button><button id="b-bot">BOT</button>
  </div>
  <div id="keys">WASD move · SHIFT/RMB crystal · LMB/J bolt · SPACE dash</div>
  <div id="dbg-info"></div>
  <script type="module" src="/src/dev/boss.ts"></script>
</body>
</html>
