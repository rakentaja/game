<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>INKWAKE — levels harness</title>
  <style>
    html, body { margin: 0; height: 100%; background: #120d0c; overflow: hidden; color: #efe1c9;
      font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace; }
    canvas#gl { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: fixed; left: 8px; top: calc(8px + env(safe-area-inset-top)); pointer-events: none;
      background: rgba(22, 16, 14, .72); padding: 6px 8px; border: 1px solid #4b3f44; white-space: pre; }
    #map { position: fixed; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); border: 1px solid #4b3f44;
      background: rgba(18, 13, 12, .88); image-rendering: pixelated; }
    #map.full { inset: 0; right: auto; bottom: auto; width: 100%; height: 100%; border: 0; }
    #bar { position: fixed; right: 8px; top: calc(8px + env(safe-area-inset-top)); display: flex; gap: 4px; }
    #bar button { font: inherit; color: #efe1c9; background: #2a2224; border: 1px solid #6c5d63; padding: 5px 8px; }
    #bar button.on { background: #6e2f2c; }
    #title { position: fixed; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none;
      font: 700 42px/1 Georgia, serif; letter-spacing: .12em; color: #efe1c9; text-shadow: 3px 3px 0 #16100e;
      opacity: 0; transition: opacity .8s; }
    #title small { display: block; font-size: 13px; letter-spacing: .4em; margin-top: 8px; color: #d99682; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="hud"></div>
  <div id="title"></div>
  <div id="bar"></div>
  <canvas id="map"></canvas>
  <script type="module" src="/src/dev/levels.ts"></script>
</body>
</html>
